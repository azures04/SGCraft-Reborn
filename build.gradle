buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        mavenCentral()
    }
    dependencies {
        classpath group: "net.minecraftforge.gradle", name: "ForgeGradle", version: "3.+", changing: true
    }
}

apply plugin: "net.minecraftforge.gradle"
apply plugin: "eclipse"
apply plugin: "maven-publish"

version = "1.15.2-0.0.2-beta"
group = "fr.azures04.sgcraftreborn"
archivesBaseName = "sgcraftreborn"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = "1.8"
println("Java: " + System.getProperty("java.version") + " JVM: " + System.getProperty("java.vm.version") + "(" + System.getProperty("java.vendor") + ") Arch: " + System.getProperty("os.arch"))

minecraft {
    mappings channel: "snapshot", version: "20210925-1.15.1"

    runs {
        client {
            workingDirectory project.file("run/client")

            property "forge.logging.markers", "SCAN,REGISTRIES,REGISTRYDUMP"
            property "forge.logging.console.level", "debug"

            mods {
                sgcraftreborn {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file("run/server")
            
            property "forge.logging.markers", "SCAN,REGISTRIES,REGISTRYDUMP"
            property "forge.logging.console.level", "debug"

            mods {
                sgcraftreborn {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file("run/data")
            
            property "forge.logging.markers", "SCAN,REGISTRIES,REGISTRYDUMP"
            property "forge.logging.console.level", "debug"

            args "--mod", "sgcraftreborn", "--all", "--output", file("src/generated/resources/")

            mods {
                sgcraftreborn {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = "CurseMaven"
        url =  "https://cursemaven.com"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.15.2-31.2.60"
    compileOnly "curse.maven:cctweaked-282001:3408526"
}

jar {
    manifest {
        attributes([
            "Specification-Title": "sgcraftreborn",
            "Specification-Vendor": "Azures04",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"Azures04",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy("reobfJar")

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
